# 构建 VitePress 站点并部署到 GitHub Pages
# 参考官方模板：https://vitepress.dev/guide/deploy#github-pages
name: Deploy VitePress site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # 注意：若仓库尚未启用 GitHub Pages（首次运行报 "Get Pages site failed"），
      # 需要先在 Settings → Pages → Source 选择 "GitHub Actions"（一次性操作）。
      # configure-pages 的 enablement 参数需要 PAT 才能自动启用，默认 GITHUB_TOKEN 下无效。
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Build with VitePress
        run: npm run docs:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
